name: Android TV APK Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag/release name to create or update"
        required: true
        default: "tv-home-latest"
      publish_release:
        description: "Create or update a GitHub Release with the APK"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Android TV debug APK
        run: make tailscale-tv-debug

      - name: Generate checksum
        run: sha256sum tailscale-tv-debug.apk > tailscale-tv-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailscale-tv-debug-apk
          path: |
            tailscale-tv-debug.apk
            tailscale-tv-debug.apk.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" tailscale-tv-debug.apk tailscale-tv-debug.apk.sha256 --clobber
          else
            gh release create "${RELEASE_TAG}" tailscale-tv-debug.apk tailscale-tv-debug.apk.sha256 \
              --title "Android TV home APK ${RELEASE_TAG}" \
              --notes "Debug-signed Android TV APK for home-server installation. Built from ${GITHUB_SHA}."
          fi
